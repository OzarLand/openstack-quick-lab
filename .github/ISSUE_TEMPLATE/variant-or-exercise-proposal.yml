name: Propose a variant or an exercise
description: A way to run the lab somewhere else (another provider, a personal machine), or a new exercise.
labels: ["kind/proposal", "status/open"]
body:
  - type: markdown
    attributes:
      value: |
        Variants are welcome on equal terms; read [CONTRIBUTING.md](https://github.com/OzarLand/openstack-quick-lab/blob/main/CONTRIBUTING.md) first. No
        marketing, no prices beyond the cost estimate, no referral links.
  - type: dropdown
    id: kind
    attributes:
      label: Proposal
      options:
        - A variant for another OpenStack cloud
        - A variant for a cloud that is not OpenStack
        - A personal-machine variant
        - A new exercise
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you propose
      description: For a variant, where it runs and what differs from the existing ones. For an exercise, what it breaks and which existing runbook repairs it.
    validations:
      required: true
  - type: dropdown
    id: cost
    attributes:
      label: Cost risk of the variant
      options:
        - Prepaid (spending cannot exceed the credit loaded)
        - Pay-as-you-go (needs a budget alert)
        - No cloud cost (personal machine)
        - Not a variant
    validations:
      required: true
  - type: input
    id: terms
    attributes:
      label: For a prepaid variant, the provider's own page that states the limit
  - type: checkboxes
    id: offer
    attributes:
      label: Offer
      options:
        - label: I am willing to write and test it myself.
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction
      options:
        - label: This issue contains no credentials, passwords, real IP addresses or hostnames.
          required: true
